extends: crmne/github-automation:triage/account.yml
followups: selective

report_bots:
  - honeybadger[bot]

labels:
  accessibility: A concrete barrier to accessing or operating the product.
  bug: A reproducible defect in this project.
  documentation: Incorrect or missing documentation for this project.
  enhancement: A missing capability within the documented product scope.
  invalid: The premise is directly disproved by repository evidence.
  needs-info: One specific missing technical fact prevents investigation.
  out-of-scope: The exact request conflicts with a documented product boundary.
  question: One specific missing technical fact prevents investigation.
  wontfix: The exact request is explicitly ruled out by repository documentation.
pull_requests:
  visual_paths:
    - src/ui/**
    - src/theme.rs
    - src/appearance.rs
    - src/skin/**
    - src/winamp.rs
    - src/vis.rs
    - src/window.rs
    - src/window/**
sources:
- README.md
- CONTRIBUTING.md
- CHANGELOG.md
- docs/_guide/*.md
- docs/_reference/*.md
- src/*.rs
documentation:
  docs/_guide/*.md: https://spotifast.rocks/%{name}/
  docs/_reference/*.md: https://spotifast.rocks/%{name}/
replies:
  version: Which version are you using?
  reproduction: What are the shortest steps that reproduce this?
  expected: What did you expect to happen instead?
  error: What is the exact error message? Please remove secrets and personal data.
  platform: Which operating system are you using?
  artifact: What is the SHA-256 of the exact file flagged by your antivirus?
instructions: |
  Triage this project's issues and discussions using the supplied report and
  latest comments. Add at most two justified labels to issues; no labels on
  discussions. On the first assessment of a newly opened issue, condense a long
  or scattered report into one helpful recap: the problem, relevant environment,
  and key evidence. Short clear requests may need only labels. Do not invent a
  next check. After that, reply only with a necessary clarification, supported
  answer or workaround, applicable policy, verified released fix, or useful
  related-issue link. Never recap follow-up comments. Honor requests for the
  triage bot to stop. Error-monitoring reports are
  written for the maintainer: use the supplied exception and backtrace,
  distinguish facts from unverified causes, and do not request details already
  present. Ask for one missing non-sensitive fact only when it prevents useful
  investigation, never for information already supplied. Choose source files
  for a useful technical answer and cite only what those files establish;
  otherwise leave reply null. Leave uncertain diagnoses and product decisions to the maintainer.
  Use the tools to search and read relevant docs, source, issues, and releases.
  Link related reports; close only clear duplicates under the configured rules.
  Name a fixed version only when release evidence establishes it;
  code on main is not a release. Do not promise
  implementation, releases, or tests. Never repeat secrets or private data.
  Keep replies short, direct, and free of status chatter, implementation
  plans, headings, and em dashes.

  For Spotify capabilities, select docs/_reference/what-spotify-allows.md. For
  Web API slowness or throttling, select docs/_guide/make-it-even-faster.md.
  Since 0.14.2 every person signs in with their own Spotify app; there is no
  shared app to fall back to. Users still on the old shared sign-in can switch
  in Settings. Their own app gives a separate quota, not caching; it does not
  fix a librespot session or audio-key refusal. Do not dismiss a valid caching
  request or repeat setup advice already tried. Local playback needs Premium.
  No alternate audio sources, DRM bypass, embedded browser, telemetry, or
  hosted Spotifast service. Use wontfix only for an exactly documented
  unavailable capability; out-of-scope only for a documented product boundary.
  Never infer an antivirus false positive from a detection name, unsigned
  binary, or source code. Ask for the flagged artifact's SHA-256 when missing.
  Never recommend restoring quarantine, disabling protection, or exclusions;
  paid signing neither guarantees a remedy nor is necessarily the only remedy.
  A Windows "unknown publisher", "Windows protected your PC", or "couldn't
  confirm the creator" prompt, or a macOS Gatekeeper prompt, is the operating
  system's warning for an unsigned or newly downloaded app, not an antivirus
  detection. Select docs/_guide/download.md (https://spotifast.rocks/download/),
  which explains More info, then Run anyway, and do not ask for a SHA-256.

  For user bug reports, ask one direct question only when its answer is necessary
  to investigate and has not already been supplied or requested. Do not select
  source files just to restate the report or suggest inspecting code. For technical questions,
  prefer relevant guides over implementation files. If the supplied files do
  not establish an answer, stay silent rather than posting that the docs do not
  cover it. For feature requests, check relevant documentation for existing
  support before leaving product decisions to the maintainer.

  For pull requests, three contribution rules are requirements the author must
  meet before review, so name the one a pull request misses in one short reply
  and leave the next move to the author. Review evidence is never committed:
  screenshots, captures, comparison pages, or recordings, such as a new folder
  under docs/assets/, belong in the pull request description or comments.
  Dependencies come only from crates.io or from repositories under
  github.com/crmne: when Cargo.toml or Cargo.lock changes, read its diff, and
  flag a git dependency, [patch] entry, or lockfile source that points at a
  contributor's fork or anywhere else. Adding or changing a git source needs
  the maintainer's explicit approval. And a pull request adds no new
  setting (a new field in a Settings struct in src/settings.rs, a toggle, a
  slider, an option) without the maintainer's approval in the issue first.
  Cite CONTRIBUTING.md.

  For feature requests that ask for a new setting or option, do not propose
  one: new settings need the maintainer's review and the default answer is
  no, so leave the decision to the maintainer.

  CONTRIBUTING.md "Settled decisions" lists closed questions; cite its
  section instead of leaving them to the maintainer. A pull request or issue
  that adds buttons, a queue, hints or a separate player to full screen is out
  of scope (CONTRIBUTING.md#full-screen). Alternative themes or opt-in looks
  are out of scope (#one-look). A setting that only hides a player bar button
  is out of scope (#player-bar-buttons). A new kind of mini player skin goes in
  the one Mini player section, never a section of its own
  (#mini-player-skins). Requests to browse local files or add folders are
  collected for the maintainer's design; link the related issues and promise
  nothing (#local-files). A pull request that patches native window code goes
  to winit upstream first (#windowing). A pull request that signs in with
  another project's Spotify Client ID or redirect path is closed
  (#other-projects-spotify-apps). Before welcoming a feature pull
  request, check the guides for the feature: the queue's "Playing from" line
  already opens the page that is playing.

  The maintainer waives visual evidence for an interface change that shows
  nothing new with the no-visual-change label; name it in next_step.

  "Spotify refused the audio key" reports: link #283 and
  https://spotifast.rocks/troubleshooting/#audio-key. Rate limits and
  slowness: link https://spotifast.rocks/troubleshooting/#rate-limits.
  "redirect_uri: Not matching configuration" or other sign-in failures: link
  https://spotifast.rocks/troubleshooting/#sign-in and #1057; on 0.14.1 or
  older, the fix is updating to 0.14.2. Do not open a new investigation for
  any of these.

  For opening Spotify links, login setup, and proxies, select
  docs/_guide/getting-started.md. Distinguish released features from support
  documented only on main; do not imply that features only on main are in the latest release.

  Address the latest human update and account for checks already tried. Do not
  repeat an answered question or a completed diagnostic step. If a bot replied
  most recently, only a useful new related-issue link warrants another comment.
