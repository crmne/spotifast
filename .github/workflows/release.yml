name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    strategy:
      fail-fast: false
      matrix:
        include:
          # Match the native packages' declared glibc 2.39 baseline.
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          # A native arm64 runner, so the GUI's system libraries need no
          # cross-compilation sysroot.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            vcpkg-triplet: x64-windows-static
            msvc-arch: x64
            pe-machine: 8664 machine \(x64\)
          # A native arm64 runner, as for Linux: the binary is built, checked
          # and started on the processor it ships for, MilkDrop included.
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            vcpkg-triplet: arm64-windows-static
            msvc-arch: arm64
            pe-machine: AA64 machine \(ARM64\)
    steps:
      - uses: actions/checkout@v7
      # The release's artifacts carry the tag's name (packages are named and versioned
      # from GITHUB_REF_NAME), but the binary reports the crate's Cargo.toml version
      # (env!("CARGO_PKG_VERSION")): v0.14.2 shipped packages named 0.14.2 whose binary
      # said 0.14.1 (#1080). Refuse the build before spending the build minutes on it.
      - name: The tag and the crate version must agree
        shell: bash
        run: |
          v=$(grep -m1 -E '^version[[:space:]]*=' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$tag" != "$v" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} names $tag, but Cargo.toml says $v; bump the crate's version or retag"
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The repository pins its toolchain; add the cross-target's standard
      # library to the toolchain the pin actually resolves to.
      - run: rustup target add ${{ matrix.target }}
      - name: GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libpipewire-0.3-dev libxkbcommon-dev \
            libwayland-dev libgl1-mesa-dev cmake libclang-dev
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        if: runner.os == 'Windows' && matrix.features == ''
        run: vcpkg install glew:${{ matrix.vcpkg-triplet }}
      # projectm-sys asks CMake for the Visual Studio generator, which the
      # runner image no longer satisfies; Ninja inside the MSVC environment
      # builds the same thing without caring which Visual Studio is on. Both
      # Windows jobs also use dumpbin below to inspect the finished binary.
      # The action sets up x64 tools unless told otherwise, which on the arm64
      # runner would compile under emulation.
      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # No compiler cache: published binaries never build from outputs
      # restored from an Actions cache.
      - run: cargo build --release --target ${{ matrix.target }} ${{ matrix.features }}

      # The zip and installer must run on a clean Windows machine without a
      # separately installed Visual C++ redistributable.
      - name: Verify standalone Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target\${{ matrix.target }}\release\spotifast.exe"
          $imports = & dumpbin /dependents $binary | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          # The updater picks its download by the running executable's
          # architecture, so a binary of the wrong one under this name would
          # keep every copy installed from it on the wrong architecture.
          $headers = & dumpbin /headers $binary | Out-String
          if ($headers -notmatch '${{ matrix.pe-machine }}') { throw "$binary is not built for ${{ matrix.target }}:`n$headers" }
          # Each Windows build runs on its own processor: start it once.
          $version = (& $binary --version | Out-String).Trim()
          if ($version -notmatch '^spotifast \d+\.\d+\.\d+') { throw "Unexpected --version output: $version" }
          # The binary's version is the crate's, not the tag's (the CLI pins
          # `spotifast {CARGO_PKG_VERSION}` exactly): a mismatch here is a release
          # carrying one version's name and another's code (#1080).
          $tag = "${{ github.ref_name }}".TrimStart("v")
          if ($version -ne "spotifast $tag") { throw "The binary reports $version, but the tag names $tag" }

      # Windows rows hand their checked binary to the windows job, which signs
      # it on x64 (Azure Artifact Signing doesn't run on Arm runners) and
      # packages it. That job replaces this artifact with the packages.
      - name: Hand the Windows binary on
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/spotifast.exe
          if-no-files-found: error

      - name: Package
        if: runner.os == 'Linux'
        shell: bash
        run: |
          name="spotifast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast" "dist/$name/"
          cp README.md LICENSE "dist/$name/"
          cp packaging/spotifast-portable.txt "dist/$name/"
          # Desktop integration for package builds and hand-installs.
          cp --parents packaging/applications/spotifast.desktop packaging/icons/spotifast.svg "dist/$name/"
          cp --parents contrib/omarchy/spotifast.json.tpl contrib/omarchy/spotifast-theme "dist/$name/"
          cd dist
          tar czf "$name.tar.gz" "$name"

      # The AppImage, from the archive just built and before the release is
      # published: checksums.txt lists it with its .zsync file and the
      # signature covers both, so the app's updater replaces an AppImage
      # only with a signed one (fastframe-update), and AppImageUpdate and
      # the updaters built on it find the .zsync file through the update
      # information inside it. Stable releases only, as before.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Linux' && !contains(github.ref_name, '-')
        with:
          ruby-version: '4.0'
      - name: AppImage
        if: runner.os == 'Linux' && !contains(github.ref_name, '-')
        run: |
          sudo apt-get install -y --no-install-recommends libarchive-tools squashfs-tools zsync
          gem install native-packages --version 0.11.0 --no-document
          case "${{ matrix.target }}" in
            x86_64-unknown-linux-gnu) id=appimage-amd64 ;;
            aarch64-unknown-linux-gnu) id=appimage-arm64 ;;
            *) echo "No AppImage target for ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          native-packages build --version "${GITHUB_REF_NAME#v}" --target "$id" --defer-recipes \
            --output "$RUNNER_TEMP/appimage"
          cp "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage \
            "$RUNNER_TEMP/appimage/packages/$id/appimage/"*.AppImage.zsync dist/

      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.AppImage
            dist/*.AppImage.zsync
          if-no-files-found: error

  windows:
    name: windows (${{ matrix.target }})
    needs: build
    # x64 for both targets: Azure Artifact Signing doesn't run on Arm
    # runners, and WiX builds arm64 packages on x64.
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    # Signs in to Azure Artifact Signing as the app registration that trusts
    # only this environment, which deploys only from v* tags (PACKAGING.md,
    # "Windows signing").
    environment: windows-signing
    # The Artifact Signing account native-packages signs with.
    env:
      AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            package-target: windows-amd64
            msvc-arch: x64
          # The MSI's custom actions cross-compile for arm64 from x64.
          - target: aarch64-pc-windows-msvc
            package-target: windows-arm64
            msvc-arch: amd64_arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release

      # native-packages signs the Windows code (native-packages.yaml,
      # windows.signing) through the Azure CLI sign-in below, once the
      # windows-signing environment names a certificate profile.
      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: '4.0'
      - name: Install native-packages
        run: gem install native-packages --version 0.11.0 --no-document
      - name: Sign in to Azure for code signing
        if: vars.AZURE_SIGNING_PROFILE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      # Signed before anything packs it, so the zip and the MSI both carry a
      # signed binary.
      - name: Sign the binary
        if: vars.AZURE_SIGNING_PROFILE != ''
        shell: pwsh
        run: native-packages sign-windows target\${{ matrix.target }}\release\spotifast.exe

      - name: Package
        shell: bash
        run: |
          name="spotifast-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/spotifast.exe" "dist/$name/"
          cp README.md LICENSE packaging/spotifast-portable.txt "dist/$name/"
          cd dist
          7z a "$name.zip" "$name"

      # The Windows installer: the Windows Installer package, which also takes
      # over a copy the Inno Setup program of 0.14.2 and earlier installed
      # (PACKAGING.md, "Windows Installer package"). build-msi.py compiles its custom actions with the MSVC tools for the
      # package's architecture.
      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc-arch }}
      # native-packages signs the MSI before recording its checksum.
      - name: Windows Installer package
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $payload = "dist\msi-input-${{ matrix.target }}"
          New-Item -ItemType Directory -Force $payload | Out-Null
          $files = "target\${{ matrix.target }}\release\spotifast.exe", "README.md", "LICENSE", "packaging\windows\spotifast-installer.txt"
          Copy-Item $files $payload
          $packages = "$env:RUNNER_TEMP\windows-packages"
          native-packages build --version $version --target ${{ matrix.package-target }} --defer-recipes --output $packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item "$packages\packages\${{ matrix.package-target }}\msi\*.msi" dist\

      # Replaces the binary the build job handed over with the packages.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          overwrite: true
          path: |
            dist/*.zip
            dist/*.msi
          if-no-files-found: error

  macos:
    name: macOS universal app
    runs-on: macos-latest
    env:
      # Complete Apple credentials enable native-packages signing/notarization.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      # No compiler cache, as in the build job above.
      - name: Build both architectures
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin

      - name: Universal binary
        run: |
          mkdir -p universal
          lipo -create \
            target/aarch64-apple-darwin/release/spotifast \
            target/x86_64-apple-darwin/release/spotifast \
            -output universal/spotifast

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      - name: Install native packaging
        run: gem install native-packages --version 0.11.0 --no-document

      - name: App bundle
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-input
          bash packaging/macos/bundle.sh universal/spotifast dist/macos-input/Spotifast.app "$version"
          cp README.md LICENSE dist/macos-input/

      - name: Package, sign and notarize macOS app
        run: |
          native-packages build \
            --version "${GITHUB_REF_NAME#v}" --target macos-universal --defer-recipes \
            --output "$RUNNER_TEMP/macos-packages"
          cp "$RUNNER_TEMP/macos-packages/packages/macos-universal/dmg/"*.dmg dist/

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: dist/*.dmg
          if-no-files-found: error

  # The Linux build packaged as a Flatpak bundle: the same binary, in the
  # sandbox packaging/flatpak describes, so nothing compiles twice. Flathub
  # builds from source on its own machines, from the manifest beside it.
  flatpak:
    name: Flatpak bundle
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v7
        with:
          name: x86_64-unknown-linux-gnu
          path: dist
      - name: Unpack the Linux build
        run: |
          tar xzf dist/spotifast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz -C packaging/flatpak "spotifast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu"
          mv packaging/flatpak/spotifast-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu packaging/flatpak/built
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: packaging/flatpak/rocks.spotifast.Spotifast.bundle.yml
          bundle: spotifast-${{ github.ref_name }}-x86_64.flatpak
          cache: false
          upload-artifact: false
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak
          path: "*.flatpak"
          if-no-files-found: error

  publish:
    name: GitHub release
    # The bundle is welcome but not required: a Flatpak failure must not
    # hold the release.
    needs: [build, windows, macos, flatpak]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success' }}
    runs-on: ubuntu-latest
    # Publishing waits for the maintainer's approval, and only this job can
    # read the release signing key (v* tags only).
    environment: release-signing
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true
      # Include the source package so source distributions can verify it
      # against the same published checksums as the binaries.
      - name: Source archive
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz" \
            --output "dist/spotifast-${GITHUB_REF_NAME}-source.tar.gz"
      - name: Public filenames, updater compatibility and checksums
        run: python3 packaging/release-names.py dist "$GITHUB_REF_NAME"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
      # Sign the manifest release-names.py wrote (checksums.txt.sig), then
      # check the signature and every listed file against the committed key.
      # Updaters that carry the key refuse releases without a valid one.
      - name: Sign checksums
        env:
          SPOTIFAST_UPDATE_SIGNING_KEY: ${{ secrets.SPOTIFAST_UPDATE_SIGNING_KEY }}
        run: |
          gem install native-packages --version 0.11.0 --no-document
          native-packages sign-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex \
            --key-env SPOTIFAST_UPDATE_SIGNING_KEY
          native-packages verify-checksums dist/checksums.txt \
            --public-key assets/update-public-key.hex
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          name: Spotifast ${{ github.ref_name }}
          # Publish reviewed notes immediately, not a generated PR-only summary.
          body_path: packaging/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          # A tag with a suffix (v0.4.0-rc1) is a pre-release: it stays
          # off "latest", so the app's update check never offers it.
          prerelease: ${{ contains(github.ref_name, '-') }}

  packaging:
    # The optional Flatpak job may fail without blocking native packages.
    if: ${{ !cancelled() && needs.publish.result == 'success' && startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
    needs: publish
    uses: ./.github/workflows/packaging.yml
    with:
      version: ${{ github.ref_name }}
    secrets: inherit
