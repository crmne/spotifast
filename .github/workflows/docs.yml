name: Docs

on:
  push:
    branches: [main]
    # A release tag deploys too: the newest tag is the docs at /, and path
    # filters do not apply to tag pushes.
    tags: ['v*']
    paths:
      - docs/**
      - .github/workflows/docs.yml
      - .github/scripts/indexnow.rb
  release:
    types: [published]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Builds the newest release at / and main at /next/, deploys to Pages and
  # submits changed URLs to IndexNow. Analytics is only included because the
  # build runs with JEKYLL_ENV=production, so a local `jekyll serve` does
  # not report visits.
  docs:
    uses: crmne/jekyll-vitepress-theme/.github/workflows/publish-docs.yml@v1
