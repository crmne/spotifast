# Run from this directory: `docker compose up -d`, then
# `docker compose run --rm jam code`, and give that code, with this server's
# public address, to the people you want in the jam.
services:
  jam:
    build:
      context: ..
      dockerfile: jam-server/Dockerfile
    restart: unless-stopped
    ports:
      - "4070:4070"
    volumes:
      - jam-data:/data

volumes:
  jam-data:
