[package]
name = "jam-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Keeps a Spotifast jam running for its listeners"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "jam-server"
path = "src/main.rs"

[dependencies]
jam-core = { path = "../crates/jam-core" }
clap = { version = "4.5", features = ["derive"] }
# The same TLS stack and ring provider the app's HTTP client already uses.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
